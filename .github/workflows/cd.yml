name: Deploy Pipeline (CD)

# ADR-014/ADR-015: this is the only place `terraform apply` of product
# resources runs — never from a local machine, including Marcelo's.
# Triggers on push to `main`, i.e. after a PR has already passed every
# Tier A required check (docs/engineering/quality-strategy.md §1.1, branch
# protection). Unlike marcelo-goncalves-blog/.github/workflows/cd.yml, this
# workflow does not re-run verify/security-scans/quality-check before
# deploying — main already enforces all of that on every merge
# (enforce_admins=true, no direct push), so re-running here would just
# duplicate an already-required gate. `terraform validate`/`plan` still run
# in this job as a final, cheap safety net immediately before apply.
#
# Assumes the same IAM role ci.yml already uses for `terraform plan`
# (AWS_ROLE_ARN_DEV) — ADR-015 reverted ADR-014's separate, more narrowly
# trusted deploy role in favor of a single role for both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A second push while an apply is in-flight must queue, not race — cancelling
# a terraform apply mid-way leaves a stuck state lock or a partially-created
# resource. cancel-in-progress: false, same reasoning as the blog project's
# cd.yml.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: event-discovery-platform
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.15.8'

jobs:
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # ADR-015: same role ci.yml already assumes for plan — no
          # separate deploy role/secret.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (dev)
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_NAME }}-dev-tfstate" \
            -backend-config="key=edp/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -var-file=env/dev.tfvars

      - name: Terraform apply (dev)
        run: terraform apply -auto-approve -input=false -var-file=env/dev.tfvars

      - name: Get Terraform outputs
        id: tf
        run: |
          outputs=$(terraform output -json)
          jq -r '"user_pool_id=\(.identity_user_pool_id.value)",
                 "users_table=\(.identity_users_table_name.value)",
                 "catalog_table=\(.catalog_table_name.value)",
                 "ingestion_queue_url=\(.catalog_ingestion_queue_url.value)"' <<< "$outputs" >> "$GITHUB_OUTPUT"

      # No HTTP endpoint exists yet (services/identity and services/catalog
      # have no Lambda handler deployed — see docs/backlog.md). The smoke
      # test proves the resources this apply just touched actually exist
      # and answer, via the same AWS APIs Tier B integration tests will use
      # — not that an application renders, because there isn't one yet.
      - name: Post-deploy smoke test (resource existence, not HTTP)
        run: |
          set -e
          echo "Checking Cognito User Pool ${{ steps.tf.outputs.user_pool_id }} ..."
          aws cognito-idp describe-user-pool --user-pool-id "${{ steps.tf.outputs.user_pool_id }}" >/dev/null
          echo "OK: user pool describable"

          echo "Checking DynamoDB table ${{ steps.tf.outputs.users_table }} ..."
          aws dynamodb describe-table --table-name "${{ steps.tf.outputs.users_table }}" >/dev/null
          echo "OK: users table ACTIVE"

          echo "Checking DynamoDB table ${{ steps.tf.outputs.catalog_table }} ..."
          aws dynamodb describe-table --table-name "${{ steps.tf.outputs.catalog_table }}" >/dev/null
          echo "OK: catalog table ACTIVE"

          echo "Checking SQS queue ${{ steps.tf.outputs.ingestion_queue_url }} ..."
          aws sqs get-queue-attributes --queue-url "${{ steps.tf.outputs.ingestion_queue_url }}" --attribute-names QueueArn >/dev/null
          echo "OK: ingestion queue describable"

      - name: Deploy summary
        run: |
          {
            echo "### Dev Deploy Complete"
            echo "- **Cognito User Pool:** ${{ steps.tf.outputs.user_pool_id }}"
            echo "- **UsersTable:** ${{ steps.tf.outputs.users_table }}"
            echo "- **CatalogTable:** ${{ steps.tf.outputs.catalog_table }}"
            echo "- **Ingestion queue:** ${{ steps.tf.outputs.ingestion_queue_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
